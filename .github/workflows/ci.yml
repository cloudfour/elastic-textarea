name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # The suite finishes in seconds. A cap keeps a hung browser from burning
    # Action minutes up to GitHub's six hour default, as happened in #79.
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7.0.1
      - name: Setup Node env 🏗
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci
      - name: Install Chromium 🌐
        run: npx playwright install --with-deps chromium
      - name: Run tests 🧪
        run: npm test
